name: "Publish (portal)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (portal)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=// --filter=synthetic-app-portal --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=synthetic-app-portal --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (cloudflare-workers/apps-portal)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-portal"
          retention-days: 1
          path: |
            apps/portal/build

  publish-cloudflare-workers-apps-portal:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-cloudflare-workers-apps-portal"
          path: "./apps/portal/build"

      - name: "Deploy to Cloudflare Workers"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: "npm run deploy"
        working-directory: "./apps/portal"

      - name: "Sync worker runtime secrets"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          STRIPE_SECRET_KEY: "${{ secrets.CBN_STRIPE_SECRET_KEY }}"
          TURNSTILE_SECRET_KEY: "${{ secrets.CBN_TURNSTILE_SECRET_KEY }}"
        run: |
          DECLARED="STRIPE_SECRET_KEY TURNSTILE_SECRET_KEY"
          wrangler secret list | jq -r '.[].name' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) echo "Removing undeclared secret: $name"; wrangler secret delete "$name" --force ;;
            esac
          done
          echo "Syncing declared secrets: $DECLARED"
          jq -n 'env | {STRIPE_SECRET_KEY, TURNSTILE_SECRET_KEY}' | wrangler secret bulk /dev/stdin
        working-directory: "./apps/portal"
