  - type: "input"
    id: "docker-version"
    attributes:
      label: "Docker Version"
      description: "Enter the complete version shown by `docker version`."
      placeholder: "e.g. 29.2.1"
    validations:
      required: true
  - type: "input"
    id: "compose-version"
    attributes:
      label: "Docker Compose Version"
      description: "Enter the Docker Compose version when Compose is used."
      placeholder: "e.g. 2.40.3"
    validations:
      required: false
  - type: "input"
    id: "host-os"
    attributes:
      label: "Host Operating System"
      description: "Enter the host operating system and version."
      placeholder: "e.g. Ubuntu 24.04, Debian 13, macOS 26"
    validations:
      required: true
  - type: "input"
    id: "architecture"
    attributes:
      label: "Host Architecture"
      description: "Enter the host architecture."
      placeholder: "e.g. amd64, arm64"
    validations:
      required: true
  - type: "input"
    id: "image-reference"
    attributes:
      label: "Image Reference"
      description: "Enter the image name and tag or digest that showed the problem."
      placeholder: "e.g. example/app:1.0.0"
    validations:
      required: true
  - type: "textarea"
    id: "deployment"
    attributes:
      label: "Deployment Configuration"
      description: "Paste only the affected service or command. __Remove all secrets and private data before submitting.__"
      render: "Shell"
    validations:
      required: true
