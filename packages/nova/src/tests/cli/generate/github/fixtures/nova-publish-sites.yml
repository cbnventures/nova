          jq -n 'env | {TURNSTILE_SECRET_KEY, AMAZON_ACCESS_KEY_ID, AMAZON_ACCESS_KEY_SECRET, AMAZON_REGION}' | npx wrangler secret bulk /dev/stdin
        working-directory: "./apps/mrjackyliang"
