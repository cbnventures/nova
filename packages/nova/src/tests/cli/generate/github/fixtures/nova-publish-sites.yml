        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Write environment file (apps-cbnventures)"
        env:
          PUBLIC_GOOGLE_TAG_MANAGER_ID: "${{ vars.CBN_PUBLIC_GOOGLE_TAG_MANAGER_ID }}"
          PUBLIC_TURNSTILE_SITE_KEY: "${{ vars.CBN_PUBLIC_TURNSTILE_SITE_KEY }}"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: "${{ vars.CBN_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
        run: |
          {
            echo "PUBLIC_GOOGLE_TAG_MANAGER_ID=$PUBLIC_GOOGLE_TAG_MANAGER_ID"
            echo "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY"
            echo "PUBLIC_STRIPE_PUBLISHABLE_KEY=$PUBLIC_STRIPE_PUBLISHABLE_KEY"
          } > .env
        working-directory: "./apps/cbnventures"

      - name: "Write environment file (apps-mrjackyliang)"
        env:
          PUBLIC_GOOGLE_TAG_MANAGER_ID: "${{ vars.MJL_PUBLIC_GOOGLE_TAG_MANAGER_ID }}"
          PUBLIC_TURNSTILE_SITE_KEY: "${{ vars.MJL_PUBLIC_TURNSTILE_SITE_KEY }}"
        run: |
          {
            echo "PUBLIC_GOOGLE_TAG_MANAGER_ID=$PUBLIC_GOOGLE_TAG_MANAGER_ID"
            echo "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY"
          } > .env
        working-directory: "./apps/mrjackyliang"

      - name: "Check project"
        run: |
          npx turbo run check --filter=portfolio-app-cbnventures --filter=portfolio-app-mrjackyliang --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=portfolio-app-cbnventures --filter=portfolio-app-mrjackyliang --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (cloudflare-workers/apps-cbnventures)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-cbnventures"
          retention-days: 1
          path: |
            apps/cbnventures/build

      - name: "Upload build artifacts (cloudflare-workers/apps-mrjackyliang)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-mrjackyliang"
          retention-days: 1
          path: |
            apps/mrjackyliang/build

  publish-cloudflare-workers-apps-cbnventures:
    needs: "build"
    runs-on: "ubuntu-latest"
