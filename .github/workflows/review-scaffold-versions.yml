name: "Review Scaffold Versions"

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: "write"
  pull-requests: "write"

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  review:
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          corepack enable npm
          npm install

      - name: "Update tested scaffold snapshot"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          npm run scaffold-versions -- --write

      - name: "Detect changes"
        id: "changes"
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Check project"
        if: "steps.changes.outputs.changed == 'true'"
        run: |
          npm run check

      - name: "Build project"
        if: "steps.changes.outputs.changed == 'true'"
        run: |
          npm run build

      - name: "Publish review branch"
        if: "steps.changes.outputs.changed == 'true'"
        env:
          BRANCH_NAME: "automation/scaffold-versions"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add packages/nova/scaffold-versions.json packages/nova/templates/scaffold-options/app/android-native
          git commit -m "Update tested scaffold dependency snapshot"
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

      - name: "Open or refresh review pull request"
        if: "steps.changes.outputs.changed == 'true'"
        env:
          BRANCH_NAME: "automation/scaffold-versions"
          GH_TOKEN: "${{ github.token }}"
        run: |
          pull_request_number="$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')"
          pull_request_body="Nova found stable scaffold dependency or platform updates, applied them to the bundled snapshot, and passed the complete project check and build. Review the generated diff before merging; this workflow never auto-merges."

          if [ -n "$pull_request_number" ]; then
            gh pr edit "$pull_request_number" --title "Update tested scaffold dependency snapshot" --body "$pull_request_body"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH_NAME" --title "Update tested scaffold dependency snapshot" --body "$pull_request_body"
          fi
