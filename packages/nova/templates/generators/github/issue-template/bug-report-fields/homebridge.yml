  - type: "input"
    id: "homebridge-version"
    attributes:
      label: "Homebridge Version"
      description: "Enter the complete Homebridge version. The Homebridge UI shows it in the \"System Information\" widget, and `homebridge -V` prints it."
      placeholder: "e.g. 1.11.2"
    validations:
      required: true
  - type: "dropdown"
    id: "configuration-method"
    attributes:
      label: "Configuration Method"
      description: "Select how the plugin was configured."
      options:
        - "Homebridge UI"
        - "`config.json`"
        - "HOOBS"
        - "Other"
    validations:
      required: false
  - type: "textarea"
    id: "plugin-configuration"
    attributes:
      label: "Plugin Configuration"
      description: "Paste only the affected plugin settings. __Replace all account details and secrets before submitting.__"
      render: "JSON"
    validations:
      required: false
