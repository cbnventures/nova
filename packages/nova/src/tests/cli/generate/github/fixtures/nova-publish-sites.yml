        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          TURNSTILE_SECRET_KEY: "${{ secrets.MJL_TURNSTILE_SECRET_KEY }}"
          AMAZON_ACCESS_KEY_ID: "${{ secrets.MJL_AMAZON_ACCESS_KEY_ID }}"
          AMAZON_ACCESS_KEY_SECRET: "${{ secrets.MJL_AMAZON_ACCESS_KEY_SECRET }}"
          AMAZON_REGION: "${{ secrets.MJL_AMAZON_REGION }}"
        run: |
