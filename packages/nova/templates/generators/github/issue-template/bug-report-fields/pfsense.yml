  - type: "dropdown"
    id: "pfsense-edition"
    attributes:
      label: "pfSense® Edition"
      description: "Select the installed pfSense® edition."
      options:
        - "Community Edition"
        - "pfSense Plus"
        - "Not Sure"
    validations:
      required: true
  - type: "input"
    id: "pfsense-version"
    attributes:
      label: "pfSense® Version"
      description: "Enter the complete pfSense® version."
      placeholder: "e.g. 2.8.1, 25.11.1"
    validations:
      required: true
