# This file is generated by @cbnventures/nova.
# Do not edit manually.
#
# Run `nova generate github workflows` to regenerate.
# See: https://nova.cbnventures.io/docs/cli/generators/github/workflows

name: "Publish (api)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (api)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    permissions:
      contents: "read"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
      summary_work_1: "${{ steps.nova-summary.outputs.summary_work_1 }}"
      summary_workspace_1: "${{ steps.nova-summary.outputs.summary_workspace_1 }}"
      summary_destination_1: "${{ steps.nova-summary.outputs.summary_destination_1 }}"
      summary_detail_1: "${{ steps.nova-summary.outputs.summary_detail_1 }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        timeout-minutes: 15
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          npm run check -- --workspace synthetic-app-api --exclude-workspace ./
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        timeout-minutes: 15
        run: |
          npm run build -- --workspace synthetic-app-api
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Validate build artifacts"
        timeout-minutes: 15
        run: |
          set -euo pipefail

          ALLOWED_ROOT="${{ github.workspace }}"
          ALLOWED_ROOT="$(realpath "$ALLOWED_ROOT")"
          cd "$ALLOWED_ROOT"

          validate_artifact_root() {
            local artifact_root="$1"
            local candidate
            local candidate_parent
            local first_file
            local relative_candidate
            local resolved_candidate
            local resolved_root

            if [ ! -e "$artifact_root" ] && [ ! -L "$artifact_root" ]; then
              echo "Artifact root does not exist: $artifact_root" >&2
              exit 1
            fi

            if ! resolved_root="$(realpath "$artifact_root")"; then
              echo "Artifact root cannot be resolved: $artifact_root" >&2
              exit 1
            fi

            case "$resolved_root" in
              "$ALLOWED_ROOT"|"$ALLOWED_ROOT"/*) ;;
              *)
                echo "Artifact root escapes its allowed boundary: $artifact_root -> $resolved_root" >&2
                exit 1
                ;;
            esac

            while IFS= read -r -d '' candidate; do
              if ! resolved_candidate="$(realpath "$candidate")"; then
                echo "Artifact contains a broken symlink: $candidate" >&2
                exit 1
              fi

              case "$resolved_candidate" in
                "$resolved_root"|"$resolved_root"/*) ;;
                *)
                  echo "Artifact symlink escapes its root: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac

              candidate_parent="$(realpath "$(dirname "$candidate")")"

              case "$candidate_parent/" in
                "$resolved_candidate"/*)
                  echo "Artifact contains a recursive symlink: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -type l -print0)

            while IFS= read -r -d '' candidate; do
              if [ "$candidate" = "$artifact_root" ]; then
                relative_candidate="$(basename "$candidate")"
              else
                relative_candidate="${candidate#"$artifact_root"/}"
              fi

              case "/$relative_candidate" in
                */.env|*/.env.*|*/.npmrc|*/.netrc|*/.ssh|*/.ssh/*|*/.aws|*/.aws/*|*/.git|*/.git/*)
                  echo "Artifact contains a sensitive hidden path: $candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -print0)

            if [ -d "$artifact_root" ]; then
              if ! first_file="$(find -L "$artifact_root" -type f -print -quit)"; then
                echo "Artifact root could not be traversed safely: $artifact_root" >&2
                exit 1
              fi
            else
              first_file="$resolved_root"
            fi

            if [ -z "$first_file" ]; then
              echo "Artifact root contains no files: $artifact_root" >&2
              exit 1
            fi
          }

          validate_artifact_root "apps/api/build"
          validate_artifact_root "apps/api/public"

      - name: "Upload build artifacts (cloudflare-workers/apps-api)"
        uses: "actions/upload-artifact@v7"
        timeout-minutes: 15
        with:
          name: "build-cloudflare-workers-apps-api"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            apps/api/build

      - name: "Upload build artifacts (vercel-nextjs/apps-api)"
        uses: "actions/upload-artifact@v7"
        timeout-minutes: 15
        with:
          name: "build-vercel-nextjs-apps-api"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            apps/api/build
            apps/api/public

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Check project"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Nova checks"
          NOVA_SUMMARY_ROW_0_DETAIL: ""
          NOVA_SUMMARY_ROW_1_WORK: "Build project"
          NOVA_SUMMARY_ROW_1_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_1_DESTINATION: "Build artifacts"
          NOVA_SUMMARY_ROW_1_DETAIL: ""
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
            printf "summary_work_1=%s\\n" "$NOVA_SUMMARY_ROW_1_WORK"
            printf "summary_workspace_1=%s\\n" "$NOVA_SUMMARY_ROW_1_WORKSPACE"
            printf "summary_destination_1=%s\\n" "$NOVA_SUMMARY_ROW_1_DESTINATION"
            printf "summary_detail_1=%s\\n" "$NOVA_SUMMARY_ROW_1_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-cloudflare-workers-apps-api:
    needs: "build"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    permissions:
      contents: "read"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Check for Nova placeholders"
        timeout-minutes: 10
        env:
          API_DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
          API_SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          PF_CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
          PF_CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
        run: |
          set -euo pipefail

          NOVA_PLACEHOLDER_FOUND="false"

          check_nova_placeholder() {
            if [[ "$2" == "NOVA_PLACEHOLDER" ]]; then
              printf '::error::%s still holds the Nova placeholder; set its real value in the repository settings.\n' "$1"
              NOVA_PLACEHOLDER_FOUND="true"
            fi
          }

          check_nova_placeholder "API_DATABASE_URL" "$API_DATABASE_URL"
          check_nova_placeholder "API_SESSION_SECRET" "$API_SESSION_SECRET"
          check_nova_placeholder "PF_CLOUDFLARE_ACCOUNT_ID" "$PF_CLOUDFLARE_ACCOUNT_ID"
          check_nova_placeholder "PF_CLOUDFLARE_API_TOKEN" "$PF_CLOUDFLARE_API_TOKEN"

          if [[ "$NOVA_PLACEHOLDER_FOUND" == "true" ]]; then
            exit 1
          fi

      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        timeout-minutes: 15
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        timeout-minutes: 15
        with:
          name: "build-cloudflare-workers-apps-api"
          path: "./apps/api/build"

      - name: "Deploy to Cloudflare Workers"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
        run: "npm run deploy"
        working-directory: "./apps/api"

      - name: "Sync worker runtime secrets"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
          SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
        run: |
          DECLARED="SESSION_SECRET DATABASE_URL"
          npx wrangler secret list | jq -r '.[].name' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) echo "Removing undeclared secret: $name"; npx wrangler secret delete "$name" < /dev/null ;;
            esac
          done
          echo "Syncing declared secrets: $DECLARED"
          jq -n 'env | {SESSION_SECRET, DATABASE_URL}' | npx wrangler secret bulk /dev/stdin
        working-directory: "./apps/api"

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Deploy worker"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Cloudflare Workers"
          NOVA_SUMMARY_ROW_0_DETAIL: ""
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-vercel-nextjs-apps-api:
    needs: "build"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    permissions:
      contents: "read"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Check for Nova placeholders"
        timeout-minutes: 10
        env:
          API_DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
          API_SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          API_VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
          PF_VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          PF_VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
        run: |
          set -euo pipefail

          NOVA_PLACEHOLDER_FOUND="false"

          check_nova_placeholder() {
            if [[ "$2" == "NOVA_PLACEHOLDER" ]]; then
              printf '::error::%s still holds the Nova placeholder; set its real value in the repository settings.\n' "$1"
              NOVA_PLACEHOLDER_FOUND="true"
            fi
          }

          check_nova_placeholder "API_DATABASE_URL" "$API_DATABASE_URL"
          check_nova_placeholder "API_SESSION_SECRET" "$API_SESSION_SECRET"
          check_nova_placeholder "API_VERCEL_PROJECT_ID" "$API_VERCEL_PROJECT_ID"
          check_nova_placeholder "PF_VERCEL_ORG_ID" "$PF_VERCEL_ORG_ID"
          check_nova_placeholder "PF_VERCEL_TOKEN" "$PF_VERCEL_TOKEN"

          if [[ "$NOVA_PLACEHOLDER_FOUND" == "true" ]]; then
            exit 1
          fi

      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        timeout-minutes: 15
        with:
          name: "build-vercel-nextjs-apps-api"

      - name: "Install Vercel CLI"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 15
        run: npm install -g vercel@latest

      - name: "Pull Vercel environment"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        working-directory: "./apps/api"

      - name: "Sync Vercel runtime environment"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 15
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
        run: |
          DECLARED="SESSION_SECRET DATABASE_URL"
          vercel env ls production --token="$VERCEL_TOKEN" | tail -n +2 | awk '{print $1}' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) [ -n "$name" ] && { echo "Removing undeclared env: $name"; vercel env rm "$name" production --yes --token="$VERCEL_TOKEN"; } ;;
            esac
          done
          SECRET_DECLARED="SESSION_SECRET DATABASE_URL"
          for name in $SECRET_DECLARED; do
            echo "Syncing env: $name"
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$(eval "echo \$$name")" | vercel env add "$name" production --sensitive --token="$VERCEL_TOKEN"
          done
        working-directory: "./apps/api"

      - name: "Deploy to Vercel"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 15
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
        working-directory: "./apps/api"

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Deploy app"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Vercel"
          NOVA_SUMMARY_ROW_0_DETAIL: "project ${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  summary:
    needs: ["build", "publish-cloudflare-workers-apps-api", "publish-vercel-nextjs-apps-api"]
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      contents: "read"
    if: "${{ always() }}"
    steps:
      - name: "Write Nova workflow summary"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_PROJECT: "${{ github.repository }}"
          NOVA_SUMMARY_PUBLISH: "${{ env.PUBLISH || 'false' }}"
          NOVA_SUMMARY_VERSION: "${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch || github.ref || github.sha }}"
          NOVA_SUMMARY_ROW_0_WORK: "Check project"
          NOVA_SUMMARY_ROW_0_WORK_OUTPUT: "${{ needs['build'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_0_WORKSPACE_OUTPUT: "${{ needs['build'].outputs.summary_workspace_0 || '' }}"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Nova checks"
          NOVA_SUMMARY_ROW_0_DESTINATION_OUTPUT: "${{ needs['build'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_0_DETAIL_OUTPUT: "${{ needs['build'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_0_RESULT: "${{ needs['build'].result }}"
          NOVA_SUMMARY_ROW_0_PUBLISH: "false"
          NOVA_SUMMARY_ROW_1_WORK: "Build project"
          NOVA_SUMMARY_ROW_1_WORK_OUTPUT: "${{ needs['build'].outputs.summary_work_1 || '' }}"
          NOVA_SUMMARY_ROW_1_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_1_WORKSPACE_OUTPUT: "${{ needs['build'].outputs.summary_workspace_1 || '' }}"
          NOVA_SUMMARY_ROW_1_DESTINATION: "Build artifacts"
          NOVA_SUMMARY_ROW_1_DESTINATION_OUTPUT: "${{ needs['build'].outputs.summary_destination_1 || '' }}"
          NOVA_SUMMARY_ROW_1_DETAIL_OUTPUT: "${{ needs['build'].outputs.summary_detail_1 || '' }}"
          NOVA_SUMMARY_ROW_1_RESULT: "${{ needs['build'].result }}"
          NOVA_SUMMARY_ROW_1_PUBLISH: "false"
          NOVA_SUMMARY_ROW_2_WORK: "Deploy worker"
          NOVA_SUMMARY_ROW_2_WORK_OUTPUT: "${{ needs['publish-cloudflare-workers-apps-api'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_2_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_2_WORKSPACE_OUTPUT: "${{ needs['publish-cloudflare-workers-apps-api'].outputs.summary_workspace_0 || '' }}"
          NOVA_SUMMARY_ROW_2_DESTINATION: "Cloudflare Workers"
          NOVA_SUMMARY_ROW_2_DESTINATION_OUTPUT: "${{ needs['publish-cloudflare-workers-apps-api'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_2_DETAIL_OUTPUT: "${{ needs['publish-cloudflare-workers-apps-api'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_2_RESULT: "${{ needs['publish-cloudflare-workers-apps-api'].result }}"
          NOVA_SUMMARY_ROW_2_PUBLISH: "true"
          NOVA_SUMMARY_ROW_3_WORK: "Deploy app"
          NOVA_SUMMARY_ROW_3_WORK_OUTPUT: "${{ needs['publish-vercel-nextjs-apps-api'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_3_WORKSPACE: "synthetic-app-api"
          NOVA_SUMMARY_ROW_3_WORKSPACE_OUTPUT: "${{ needs['publish-vercel-nextjs-apps-api'].outputs.summary_workspace_0 || '' }}"
          NOVA_SUMMARY_ROW_3_DESTINATION: "Vercel"
          NOVA_SUMMARY_ROW_3_DESTINATION_OUTPUT: "${{ needs['publish-vercel-nextjs-apps-api'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_3_DETAIL_OUTPUT: "${{ needs['publish-vercel-nextjs-apps-api'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_3_RESULT: "${{ needs['publish-vercel-nextjs-apps-api'].result }}"
          NOVA_SUMMARY_ROW_3_PUBLISH: "true"
        run: |
          set -euo pipefail

          sanitize_summary_value() {
            local value="$1"

            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            value="${value//|/\\|}"

            printf '%s' "$value"
          }

          NOVA_SUMMARY_DISPLAY_VERSION="${NOVA_SUMMARY_VERSION#refs/tags/}"
          NOVA_SUMMARY_DISPLAY_VERSION="${NOVA_SUMMARY_DISPLAY_VERSION#refs/heads/}"

          {
            printf "## Nova · %s · %s\\n" "$NOVA_SUMMARY_PROJECT" "$NOVA_SUMMARY_DISPLAY_VERSION"
            printf "\\n"
            printf "| Work | Workspace | Destination | Result |\\n"
            printf "| --- | --- | --- | --- |\\n"

            NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_0_WORK_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORK" ]]; then
              NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_0_WORK"
            fi

            NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_0_WORKSPACE_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORKSPACE" ]]; then
              NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_0_WORKSPACE"
            fi

            NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_0_DESTINATION_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_DESTINATION" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_0_DESTINATION"
            fi

            NOVA_SUMMARY_DETAIL="$NOVA_SUMMARY_ROW_0_DETAIL_OUTPUT"
            if [[ -n "$NOVA_SUMMARY_DETAIL" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_DESTINATION · $NOVA_SUMMARY_DETAIL"
            fi

            NOVA_SUMMARY_RESULT="$NOVA_SUMMARY_ROW_0_RESULT"
            if [[ "$NOVA_SUMMARY_ROW_0_PUBLISH" == "true" && "$NOVA_SUMMARY_PUBLISH" != "true" ]]; then
              NOVA_SUMMARY_RESULT="dry run ($NOVA_SUMMARY_RESULT)"
            fi

            NOVA_SUMMARY_WORK="$(sanitize_summary_value "$NOVA_SUMMARY_WORK")"
            NOVA_SUMMARY_WORKSPACE="$(sanitize_summary_value "$NOVA_SUMMARY_WORKSPACE")"
            NOVA_SUMMARY_DESTINATION="$(sanitize_summary_value "$NOVA_SUMMARY_DESTINATION")"
            NOVA_SUMMARY_RESULT="$(sanitize_summary_value "$NOVA_SUMMARY_RESULT")"

            printf "| %s | %s | %s | %s |\\n" "$NOVA_SUMMARY_WORK" "$NOVA_SUMMARY_WORKSPACE" "$NOVA_SUMMARY_DESTINATION" "$NOVA_SUMMARY_RESULT"

            NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_1_WORK_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORK" ]]; then
              NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_1_WORK"
            fi

