          echo "Syncing declared secrets: $DECLARED"
          jq -n 'env | {TURNSTILE_SECRET_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, AMAZON_ACCESS_KEY_ID, AMAZON_ACCESS_KEY_SECRET, AMAZON_REGION}' | wrangler secret bulk /dev/stdin
