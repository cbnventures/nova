name: "Publish (pages)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (pages)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=nova-app-docs --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=nova-app-docs --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (github-pages-docusaurus/apps-docs)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-github-pages-docusaurus-apps-docs"
          retention-days: 1
          path: |
            apps/docs/build

  publish-github-pages-docusaurus-apps-docs:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-github-pages-docusaurus-apps-docs"
          path: "./apps/docs/build"

      - name: "Check GitHub Pages status"
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "[Pages] GitHub Pages is enabled."
            echo "PAGES_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "[Pages] GitHub Pages is not enabled. Skipping deployment."
            echo "PAGES_ENABLED=false" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Setup GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/configure-pages@v6"

      - name: "Upload artifact to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/upload-pages-artifact@v5"
        with:
          path: "./apps/docs/build"

      - name: "Deploy to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/deploy-pages@v5"
