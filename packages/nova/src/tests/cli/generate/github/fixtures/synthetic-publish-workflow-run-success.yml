# This file is generated by @cbnventures/nova.
# Do not edit manually.
#
# Run `nova generate github workflows` to regenerate.
# See: https://nova.cbnventures.io/docs/cli/generators/github/workflows

name: "Publish (addon)"

run-name: "Publishing ${{ github.event.workflow_run.head_branch || 'manually' }} (addon)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  workflow_run:
    workflows:
      - "Publish (core)"
    types:
      - "completed"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    if: "${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=sandbox-addon --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=sandbox-addon --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (npm/packages-addon)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-npm-packages-addon"
          retention-days: 1
          path: |
            packages/addon/build

  publish-npm-packages-addon:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
    if: "${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: "Remove deprecated .npmrc entries"
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          if [ -f "$npmrc" ]; then
            sed -i '/^always-auth=/d' "$npmrc"
          fi

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-npm-packages-addon"
          path: "./packages/addon/build"

      - name: "Configure authentication"
        env:
          NPM_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "[Auth] Using NPM_TOKEN (token-based)."
            echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
          else
            echo "[Auth] Using trusted publishing (OIDC)."

            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

            if [ -f "$npmrc" ]; then
              sed -i '/^\/\/registry\.npmjs\.org\/:_authToken/d' "$npmrc"
              echo "[Auth] Removed _authToken entry from .npmrc."
            fi
          fi

      - name: "Publish package to npm"
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            echo "[Publish] Production."
            npm publish --provenance --access public
          else
            echo "[Publish] Dry run."
            npm publish --dry-run
          fi
        working-directory: "./packages/addon"
