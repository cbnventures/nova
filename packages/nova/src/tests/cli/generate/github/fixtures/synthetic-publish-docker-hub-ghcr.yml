name: "Publish (containers)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (containers)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=sandbox-api --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=sandbox-api --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

  publish-docker-hub-services-api:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
      attestations: "write"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v3"
        with:
          platforms: "linux/amd64,linux/arm64"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Login to Docker Hub"
        uses: "docker/login-action@v3"
        env:
          DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
        with:
          username: "${{ vars.DOCKERHUB_USERNAME }}"
          password: "${{ env.DOCKERHUB_TOKEN }}"

      - name: "Build and push"
        id: "build-push"
        uses: "docker/build-push-action@v6"
        with:
          context: "./services/api"
          platforms: "linux/amd64,linux/arm64"
          push: "${{ env.PUBLISH }}"
          tags: |
            ${{ github.repository }}:latest
            ${{ github.repository }}:${{ github.event.release.tag_name || 'manual' }}

      - name: "Generate build provenance"
        if: "${{ env.PUBLISH == 'true' }}"
        uses: "actions/attest-build-provenance@v2"
        with:
          subject-name: "docker.io/${{ github.repository }}"
          subject-digest: "${{ steps.build-push.outputs.digest }}"
          push-to-registry: true

  publish-ghcr-services-api:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
      packages: "write"
      attestations: "write"
      id-token: "write"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v3"
        with:
          platforms: "linux/amd64,linux/arm64"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Login to GitHub Container Registry"
        uses: "docker/login-action@v3"
        with:
          registry: "ghcr.io"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build and push"
        id: "build-push"
        uses: "docker/build-push-action@v6"
        with:
          context: "./services/api"
          platforms: "linux/amd64,linux/arm64"
          push: "${{ env.PUBLISH }}"
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name || 'manual' }}

      - name: "Generate build provenance"
        if: "${{ env.PUBLISH == 'true' }}"
        uses: "actions/attest-build-provenance@v2"
        with:
          subject-name: "ghcr.io/${{ github.repository }}"
          subject-digest: "${{ steps.build-push.outputs.digest }}"
          push-to-registry: true
