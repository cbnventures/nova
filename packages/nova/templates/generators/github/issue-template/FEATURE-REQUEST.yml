# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
#
# Conditional content is injected automatically by the generator:
#
#   - Pronouns ([__WE__], [__US__], [__OUR__]) based on project.pronouns.
#   - Questions ([__QUESTION_FIELDS__]): global-fields/feature-request.yml, then
#     each github.issueTemplate.bugReportFields set from feature-request-fields/,
#     then github.issueTemplate.customQuestions.feature. Missing files add nothing.
#   - Legal agreements from legal-agreements/ when urls.termsOfUse or urls.privacyPolicy is set.
#
# ============================================================================
name: "Feature Request"
description: "Have a new feature in mind? Share your request with [__US__]."
title: "[Feature]: "
labels: [ "enhancement" ]
body:
  - type: "markdown"
    attributes:
      value: "Thank you for contributing to the improvement of this project by submitting a feature request!"
  - type: "markdown"
    attributes:
      value: "Please __fill out the form with as much detail as possible__ to help [__US__] understand your feature request better."
  - type: "markdown"
    attributes:
      value: "---"
  - type: "checkboxes"
    id: "pre-check"
    attributes:
      label: "Feature Request Confirmation"
      description: "Confirm that this submission belongs in the feature request form."
      options:
        - label: "I have provided a descriptive title and kept the original title prefix, __\"[Feature]: \"__"
          required: true
        - label: "I searched open and closed issues and did not find the same request"
          required: true
        - label: "The requested behavior is not already available"
          required: true
  - type: "input"
    id: "email"
    attributes:
      label: "Your email address"
      description: "Help [__US__] easily get in touch with you if [__WE__] need more information. __If possible, please consider using an alias you have access to, as this information is publicly visible.__"
      placeholder: "e.g. user@example.com"
    validations:
      required: true
[__QUESTION_FIELDS__]
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Additional Context"
      description: "Add any other information that could help explain the submission."
    validations:
      required: false
[__LEGAL_AGREEMENTS__]
