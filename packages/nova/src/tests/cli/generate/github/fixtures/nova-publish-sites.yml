name: "Publish (sites)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (sites)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Write environment file (apps-cbnventures)"
        env:
          PUBLIC_GOOGLE_TAG_MANAGER_ID: "${{ vars.CBN_PUBLIC_GOOGLE_TAG_MANAGER_ID }}"
          PUBLIC_TURNSTILE_SITE_KEY: "${{ vars.CBN_PUBLIC_TURNSTILE_SITE_KEY }}"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: "${{ vars.CBN_PUBLIC_STRIPE_PUBLISHABLE_KEY }}"
        run: |
          {
            echo "PUBLIC_GOOGLE_TAG_MANAGER_ID=\"$PUBLIC_GOOGLE_TAG_MANAGER_ID\""
            echo "PUBLIC_TURNSTILE_SITE_KEY=\"$PUBLIC_TURNSTILE_SITE_KEY\""
            echo "PUBLIC_STRIPE_PUBLISHABLE_KEY=\"$PUBLIC_STRIPE_PUBLISHABLE_KEY\""
          } > .env
        working-directory: "./apps/cbnventures"

      - name: "Write environment file (apps-mrjackyliang)"
        env:
          PUBLIC_GOOGLE_TAG_MANAGER_ID: "${{ vars.MJL_PUBLIC_GOOGLE_TAG_MANAGER_ID }}"
          PUBLIC_TURNSTILE_SITE_KEY: "${{ vars.MJL_PUBLIC_TURNSTILE_SITE_KEY }}"
        run: |
          {
            echo "PUBLIC_GOOGLE_TAG_MANAGER_ID=\"$PUBLIC_GOOGLE_TAG_MANAGER_ID\""
            echo "PUBLIC_TURNSTILE_SITE_KEY=\"$PUBLIC_TURNSTILE_SITE_KEY\""
          } > .env
        working-directory: "./apps/mrjackyliang"

      - name: "Check project"
        run: |
          npm run check -- --workspace portfolio-app-cbnventures --workspace portfolio-app-mrjackyliang
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npm run build -- --workspace portfolio-app-cbnventures --workspace portfolio-app-mrjackyliang
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Validate build artifacts"
        run: |
          set -euo pipefail

          ALLOWED_ROOT="${{ github.workspace }}"
          ALLOWED_ROOT="$(realpath "$ALLOWED_ROOT")"
          cd "$ALLOWED_ROOT"

          validate_artifact_root() {
            local artifact_root="$1"
            local candidate
            local candidate_parent
            local first_file
            local relative_candidate
            local resolved_candidate
            local resolved_root

            if [ ! -e "$artifact_root" ] && [ ! -L "$artifact_root" ]; then
              echo "Artifact root does not exist: $artifact_root" >&2
              exit 1
            fi

            if ! resolved_root="$(realpath "$artifact_root")"; then
              echo "Artifact root cannot be resolved: $artifact_root" >&2
              exit 1
            fi

            case "$resolved_root" in
              "$ALLOWED_ROOT"|"$ALLOWED_ROOT"/*) ;;
              *)
                echo "Artifact root escapes its allowed boundary: $artifact_root -> $resolved_root" >&2
                exit 1
                ;;
            esac

            while IFS= read -r -d '' candidate; do
              if ! resolved_candidate="$(realpath "$candidate")"; then
                echo "Artifact contains a broken symlink: $candidate" >&2
                exit 1
              fi

              case "$resolved_candidate" in
                "$resolved_root"|"$resolved_root"/*) ;;
                *)
                  echo "Artifact symlink escapes its root: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac

              candidate_parent="$(realpath "$(dirname "$candidate")")"

              case "$candidate_parent/" in
                "$resolved_candidate"/*)
                  echo "Artifact contains a recursive symlink: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -type l -print0)

            while IFS= read -r -d '' candidate; do
              if [ "$candidate" = "$artifact_root" ]; then
                relative_candidate="$(basename "$candidate")"
              else
                relative_candidate="${candidate#"$artifact_root"/}"
              fi

              case "/$relative_candidate" in
                */.env|*/.env.*|*/.npmrc|*/.netrc|*/.ssh|*/.ssh/*|*/.aws|*/.aws/*|*/.git|*/.git/*)
                  echo "Artifact contains a sensitive hidden path: $candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -print0)

            if [ -d "$artifact_root" ]; then
              if ! first_file="$(find -L "$artifact_root" -type f -print -quit)"; then
                echo "Artifact root could not be traversed safely: $artifact_root" >&2
                exit 1
              fi
            else
              first_file="$resolved_root"
            fi

            if [ -z "$first_file" ]; then
              echo "Artifact root contains no files: $artifact_root" >&2
              exit 1
            fi
          }

          validate_artifact_root "apps/cbnventures/build"
          validate_artifact_root "apps/mrjackyliang/build"

      - name: "Upload build artifacts (cloudflare-workers/apps-cbnventures)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-cbnventures"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            apps/cbnventures/build

      - name: "Upload build artifacts (cloudflare-workers/apps-mrjackyliang)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-mrjackyliang"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            apps/mrjackyliang/build

  publish-cloudflare-workers-apps-cbnventures:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-cloudflare-workers-apps-cbnventures"
          path: "./apps/cbnventures/build"

      - name: "Deploy to Cloudflare Workers"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: "npm run deploy"
        working-directory: "./apps/cbnventures"

      - name: "Sync worker runtime secrets"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          TURNSTILE_SECRET_KEY: "${{ secrets.CBN_TURNSTILE_SECRET_KEY }}"
          STRIPE_SECRET_KEY: "${{ secrets.CBN_STRIPE_SECRET_KEY }}"
          STRIPE_WEBHOOK_SECRET: "${{ secrets.CBN_STRIPE_WEBHOOK_SECRET }}"
          AMAZON_ACCESS_KEY_ID: "${{ secrets.CBN_AMAZON_ACCESS_KEY_ID }}"
          AMAZON_ACCESS_KEY_SECRET: "${{ secrets.CBN_AMAZON_ACCESS_KEY_SECRET }}"
          AMAZON_REGION: "${{ secrets.CBN_AMAZON_REGION }}"
        run: |
          DECLARED="TURNSTILE_SECRET_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET AMAZON_ACCESS_KEY_ID AMAZON_ACCESS_KEY_SECRET AMAZON_REGION"
          npx wrangler secret list | jq -r '.[].name' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) echo "Removing undeclared secret: $name"; npx wrangler secret delete "$name" --force ;;
            esac
          done
          echo "Syncing declared secrets: $DECLARED"
          jq -n 'env | {TURNSTILE_SECRET_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, AMAZON_ACCESS_KEY_ID, AMAZON_ACCESS_KEY_SECRET, AMAZON_REGION}' | npx wrangler secret bulk /dev/stdin
        working-directory: "./apps/cbnventures"

  publish-cloudflare-workers-apps-mrjackyliang:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
