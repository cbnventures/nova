name: "Publish (api)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (api)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npm run check -- --workspace synthetic-app-api
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npm run build -- --workspace synthetic-app-api
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Validate build artifacts"
        run: |
          set -euo pipefail

          ALLOWED_ROOT="${{ github.workspace }}"
          ALLOWED_ROOT="$(realpath "$ALLOWED_ROOT")"
          cd "$ALLOWED_ROOT"

          validate_artifact_root() {
            local artifact_root="$1"
            local candidate
            local candidate_parent
            local first_file
            local relative_candidate
            local resolved_candidate
            local resolved_root

            if [ ! -e "$artifact_root" ] && [ ! -L "$artifact_root" ]; then
              echo "Artifact root does not exist: $artifact_root" >&2
              exit 1
            fi

            if ! resolved_root="$(realpath "$artifact_root")"; then
              echo "Artifact root cannot be resolved: $artifact_root" >&2
              exit 1
            fi

            case "$resolved_root" in
              "$ALLOWED_ROOT"|"$ALLOWED_ROOT"/*) ;;
              *)
                echo "Artifact root escapes its allowed boundary: $artifact_root -> $resolved_root" >&2
                exit 1
                ;;
            esac

            while IFS= read -r -d '' candidate; do
              if ! resolved_candidate="$(realpath "$candidate")"; then
                echo "Artifact contains a broken symlink: $candidate" >&2
                exit 1
              fi

              case "$resolved_candidate" in
                "$resolved_root"|"$resolved_root"/*) ;;
                *)
                  echo "Artifact symlink escapes its root: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac

              candidate_parent="$(realpath "$(dirname "$candidate")")"

              case "$candidate_parent/" in
                "$resolved_candidate"/*)
                  echo "Artifact contains a recursive symlink: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -type l -print0)

            while IFS= read -r -d '' candidate; do
              if [ "$candidate" = "$artifact_root" ]; then
                relative_candidate="$(basename "$candidate")"
              else
                relative_candidate="${candidate#"$artifact_root"/}"
              fi

              case "/$relative_candidate" in
                */.env|*/.env.*|*/.npmrc|*/.netrc|*/.ssh|*/.ssh/*|*/.aws|*/.aws/*|*/.git|*/.git/*)
                  echo "Artifact contains a sensitive hidden path: $candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -print0)

            if [ -d "$artifact_root" ]; then
              if ! first_file="$(find -L "$artifact_root" -type f -print -quit)"; then
                echo "Artifact root could not be traversed safely: $artifact_root" >&2
                exit 1
              fi
            else
              first_file="$resolved_root"
            fi

            if [ -z "$first_file" ]; then
              echo "Artifact root contains no files: $artifact_root" >&2
              exit 1
            fi
          }

          validate_artifact_root "apps/api/build"
          validate_artifact_root "apps/api/public"

      - name: "Upload build artifacts (cloudflare-workers/apps-api)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-api"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            apps/api/build

      - name: "Upload build artifacts (vercel-nextjs/apps-api)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-vercel-nextjs-apps-api"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            apps/api/build
            apps/api/public

  publish-cloudflare-workers-apps-api:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-cloudflare-workers-apps-api"
          path: "./apps/api/build"

      - name: "Deploy to Cloudflare Workers"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
        run: "npm run deploy"
        working-directory: "./apps/api"

      - name: "Sync worker runtime secrets"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
          SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
        run: |
          DECLARED="SESSION_SECRET DATABASE_URL"
          npx wrangler secret list | jq -r '.[].name' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) echo "Removing undeclared secret: $name"; npx wrangler secret delete "$name" --force ;;
            esac
          done
          echo "Syncing declared secrets: $DECLARED"
          jq -n 'env | {SESSION_SECRET, DATABASE_URL}' | npx wrangler secret bulk /dev/stdin
        working-directory: "./apps/api"

  publish-vercel-nextjs-apps-api:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-vercel-nextjs-apps-api"

      - name: "Install Vercel CLI"
        if: "${{ env.PUBLISH == 'true' }}"
        run: npm install -g vercel@latest

      - name: "Pull Vercel environment"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        working-directory: "./apps/api"

      - name: "Sync Vercel runtime environment"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
        run: |
          DECLARED="SESSION_SECRET DATABASE_URL"
          vercel env ls production --token="$VERCEL_TOKEN" | tail -n +2 | awk '{print $1}' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) [ -n "$name" ] && { echo "Removing undeclared env: $name"; vercel env rm "$name" production --yes --token="$VERCEL_TOKEN"; } ;;
            esac
          done
          SECRET_DECLARED="SESSION_SECRET DATABASE_URL"
          for name in $SECRET_DECLARED; do
            echo "Syncing env: $name"
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$(eval "echo \$$name")" | vercel env add "$name" production --sensitive --token="$VERCEL_TOKEN"
          done
        working-directory: "./apps/api"

      - name: "Deploy to Vercel"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
        working-directory: "./apps/api"
