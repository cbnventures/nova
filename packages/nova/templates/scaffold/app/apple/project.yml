name: [__WORKSPACE_IDENTIFIER__]
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "[__SCAFFOLD_VERSION_APPLE_IOS_DEPLOYMENT_TARGET__]"
    macOS: "[__SCAFFOLD_VERSION_APPLE_MACOS_DEPLOYMENT_TARGET__]"
    tvOS: "[__SCAFFOLD_VERSION_APPLE_TVOS_DEPLOYMENT_TARGET__]"
    visionOS: "[__SCAFFOLD_VERSION_APPLE_VISIONOS_DEPLOYMENT_TARGET__]"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "[__SCAFFOLD_VERSION_APPLE_SWIFT__]"
    MARKETING_VERSION: "[__WORKSPACE_VERSION__]"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  [__WORKSPACE_IDENTIFIER__]:
    type: application
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: Sources
        excludes:
          - "iOS/**"
          - "MacOS/**"
          - "MacOS_12/**"
          - "tvOS/**"
          - "VisionOS/**"
      - path: Sources/iOS
        group: Sources
        destinationFilters: [iOS]
      - path: Sources/MacOS
        group: Sources
        destinationFilters: [macOS]
      - path: Sources/MacOS_12
        group: Sources
        destinationFilters: [macOS]
      - path: Sources/tvOS
        group: Sources
        destinationFilters: [tvOS]
      - path: Sources/VisionOS
        group: Sources
        destinationFilters: [visionOS]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_NAME: [__WORKSPACE_TITLE__]
        PRODUCT_BUNDLE_IDENTIFIER: [__APPLE_BUNDLE_IDENTIFIER__]
        ENABLE_PREVIEWS: YES
  [__WORKSPACE_IDENTIFIER__]Tests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: [__APPLE_BUNDLE_IDENTIFIER__].tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/[__WORKSPACE_IDENTIFIER__].app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/[__WORKSPACE_IDENTIFIER__]
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: [__WORKSPACE_IDENTIFIER__]
schemes:
  [__WORKSPACE_IDENTIFIER__]:
    build:
      targets:
        [__WORKSPACE_IDENTIFIER__]: all
        [__WORKSPACE_IDENTIFIER__]Tests: [test]
    test:
      targets:
        - [__WORKSPACE_IDENTIFIER__]Tests
