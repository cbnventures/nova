name: [__WORKSPACE_IDENTIFIER__]
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "[__SCAFFOLD_VERSION_APPLE_IOS_DEPLOYMENT_TARGET__]"
    macOS: "[__SCAFFOLD_VERSION_APPLE_MACOS_DEPLOYMENT_TARGET__]"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "[__SCAFFOLD_VERSION_APPLE_SWIFT__]"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  [__WORKSPACE_IDENTIFIER__]:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: [__WORKSPACE_TITLE__]
        PRODUCT_BUNDLE_IDENTIFIER: [__APPLE_BUNDLE_IDENTIFIER__]
        ENABLE_PREVIEWS: YES
  [__WORKSPACE_IDENTIFIER__]Tests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: [__APPLE_BUNDLE_IDENTIFIER__].tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/[__WORKSPACE_IDENTIFIER__].app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/[__WORKSPACE_IDENTIFIER__]
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: [__WORKSPACE_IDENTIFIER__]
schemes:
  [__WORKSPACE_IDENTIFIER__]:
    build:
      targets:
        [__WORKSPACE_IDENTIFIER__]: all
        [__WORKSPACE_IDENTIFIER__]Tests: [test]
    test:
      targets:
        - [__WORKSPACE_IDENTIFIER__]Tests
