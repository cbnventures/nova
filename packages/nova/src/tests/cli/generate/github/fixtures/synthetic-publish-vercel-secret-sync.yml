name: "Publish (vercel-secret-sync)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (vercel-secret-sync)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=// --filter=nova-app-web --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=nova-app-web --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (vercel-nextjs/apps-web)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-vercel-nextjs-apps-web"
          retention-days: 1
          path: |
            apps/web/build
            apps/web/public

  publish-vercel-nextjs-apps-web:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-vercel-nextjs-apps-web"

      - name: "Install Vercel CLI"
        if: "${{ env.PUBLISH == 'true' }}"
        run: npm install -g vercel@latest

      - name: "Pull Vercel environment"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.CBN_VERCEL_PROJECT_ID }}"
        run: |
          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        working-directory: "./apps/web"

      - name: "Sync Vercel runtime environment"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
          STRIPE_SECRET_KEY: "${{ secrets.CBN_STRIPE_SECRET_KEY }}"
          TURNSTILE_SECRET_KEY: "${{ secrets.CBN_TURNSTILE_SECRET_KEY }}"
        run: |
          DECLARED="STRIPE_SECRET_KEY TURNSTILE_SECRET_KEY"
          vercel env ls production --token="$VERCEL_TOKEN" | tail -n +2 | awk '{print $1}' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) [ -n "$name" ] && { echo "Removing undeclared env: $name"; vercel env rm "$name" production --yes --token="$VERCEL_TOKEN"; } ;;
            esac
          done
          SECRET_DECLARED="STRIPE_SECRET_KEY TURNSTILE_SECRET_KEY"
          for name in $SECRET_DECLARED; do
            echo "Syncing env: $name"
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$(eval "echo \$$name")" | vercel env add "$name" production --sensitive --token="$VERCEL_TOKEN"
          done
        working-directory: "./apps/web"

      - name: "Deploy to Vercel"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.CBN_VERCEL_PROJECT_ID }}"
        run: |
          vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
        working-directory: "./apps/web"
