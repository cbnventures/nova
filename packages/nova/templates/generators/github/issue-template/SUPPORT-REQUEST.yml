# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
#
# Conditional content is injected automatically by the generator:
#
#   - Pronouns ([__WE__], [__US__], [__OUR__]) based on project.pronouns.
#   - The sponsor notice and sponsor check from conditional-fields/ when support
#     is sponsor-gated: a "check-sponsor-gated-issues" workflow is configured
#     and urls.fundSources lists a GitHub Sponsors page.
#   - Questions ([__QUESTION_FIELDS__]): global-fields/support-request.yml, then
#     each github.issueTemplate.bugReportFields set from support-request-fields/,
#     then github.issueTemplate.customQuestions.support. Missing files add nothing.
#   - Legal agreements from legal-agreements/ when urls.termsOfUse or urls.privacyPolicy is set.
#
# ============================================================================
name: "Support Request"
description: "Ask for help with deployment, configuration, or upgrades."
title: "[Support]: "
labels: [ "question" ]
body:
[__SPONSOR_NOTICE__]
  - type: "markdown"
    attributes:
      value: "Please __fill out the form with as much detail as possible__ to help [__US__] understand your request. Thank you!"
  - type: "markdown"
    attributes:
      value: "---"
  - type: "checkboxes"
    id: "pre-check"
    attributes:
      label: "Support Request Confirmation"
      description: "Confirm that you checked the available project information before requesting help."
      options:
[__SPONSOR_CHECK__]
        - label: "I have kept the original title prefix, __\"[Support]: \"__"
          required: true
        - label: "I reviewed the README and other available documentation"
          required: true
        - label: "I searched open and closed issues for the same question"
          required: true
[__QUESTION_FIELDS__]
  - type: "textarea"
    id: "logs"
    attributes:
      label: "Relevant Logs"
      description: "Paste the relevant failure output when available. __Remove all secrets and personal data before submitting.__ This block is formatted as code, so there is no need for backticks."
      render: "Shell"
    validations:
      required: false
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Additional Context"
      description: "Add any other information that could help explain the submission."
    validations:
      required: false
[__LEGAL_AGREEMENTS__]
