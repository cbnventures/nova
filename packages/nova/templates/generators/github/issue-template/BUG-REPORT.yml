# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
#
# Conditional content is injected automatically by the generator:
#
#   - Pronouns ([__WE__], [__US__], [__OUR__]) based on project.pronouns.
#   - The documentation check from conditional-fields/ when urls.documentation
#     or github.owner and github.repo are set.
#   - Questions ([__QUESTION_FIELDS__]): global-fields/bug-report.yml, then each
#     github.issueTemplate.bugReportFields set from bug-report-fields/, then
#     github.issueTemplate.customQuestions.bug.
#   - Legal agreements from legal-agreements/ when urls.termsOfUse or urls.privacyPolicy is set.
#
# ============================================================================
name: "Bug Report"
description: "Found an unexpected issue or problem? Report it here."
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: "markdown"
    attributes:
      value: "[__WE__] truly appreciate you taking the time to share this bug report with [__US__]."
  - type: "markdown"
    attributes:
      value: "Please __fill out the form with as much detail as possible__ so [__WE__] can recreate the problem."
  - type: "markdown"
    attributes:
      value: "---"
  - type: "checkboxes"
    id: "pre-check"
    attributes:
      label: "Bug Report Confirmation"
      description: "Confirm that this submission belongs in the bug report form."
      options:
        - label: "I have provided a descriptive title and kept the original title prefix, __\"[Bug]: \"__"
          required: true
        - label: "I searched open and closed issues and did not find the same problem"
          required: true
[__DOCUMENTATION_CHECK__]
        - label: "I am reporting behavior that is not working as documented or intended"
          required: true
  - type: "input"
    id: "email"
    attributes:
      label: "Your email address"
      description: "Help [__US__] easily get in touch with you if [__WE__] need more information. __If possible, please consider using an alias you have access to, as this information is publicly visible.__"
      placeholder: "e.g. user@example.com"
    validations:
      required: true
[__QUESTION_FIELDS__]
  - type: "textarea"
    id: "logs"
    attributes:
      label: "Relevant Logs"
      description: "Paste the relevant failure output when available. __Remove all secrets and personal data before submitting.__ This block is formatted as code, so there is no need for backticks."
      render: "Shell"
    validations:
      required: false
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Additional Context"
      description: "Add any other information that could help explain the submission."
    validations:
      required: false
[__LEGAL_AGREEMENTS__]
