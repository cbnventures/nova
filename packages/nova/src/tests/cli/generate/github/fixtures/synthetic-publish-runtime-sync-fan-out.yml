name: "Publish (api)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (api)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        run: |
          npx turbo run check --filter=// --filter=synthetic-app-api --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        run: |
          npx turbo run build --filter=synthetic-app-api --concurrency=2
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Upload build artifacts (cloudflare-workers/apps-api)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-cloudflare-workers-apps-api"
          retention-days: 1
          path: |
            apps/api/build

      - name: "Upload build artifacts (vercel-nextjs/apps-api)"
        uses: "actions/upload-artifact@v7"
        with:
          name: "build-vercel-nextjs-apps-api"
          retention-days: 1
          path: |
            apps/api/build
            apps/api/public

  publish-cloudflare-workers-apps-api:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        run: |
          npm install -g npm@latest
          npm install
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-cloudflare-workers-apps-api"
          path: "./apps/api/build"

      - name: "Deploy to Cloudflare Workers"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
        run: "npm run deploy"
        working-directory: "./apps/api"

      - name: "Sync worker runtime secrets"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.PF_CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.PF_CLOUDFLARE_ACCOUNT_ID }}"
          SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
        run: |
          DECLARED="SESSION_SECRET DATABASE_URL"
          wrangler secret list | jq -r '.[].name' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) echo "Removing undeclared secret: $name"; wrangler secret delete "$name" --force ;;
            esac
          done
          echo "Syncing declared secrets: $DECLARED"
          jq -n 'env | {SESSION_SECRET, DATABASE_URL}' | wrangler secret bulk /dev/stdin
        working-directory: "./apps/api"

  publish-vercel-nextjs-apps-api:
    needs: "build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup Node.js"
        uses: "actions/setup-node@v6"
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-vercel-nextjs-apps-api"

      - name: "Install Vercel CLI"
        if: "${{ env.PUBLISH == 'true' }}"
        run: npm install -g vercel@latest

      - name: "Pull Vercel environment"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
        working-directory: "./apps/api"

      - name: "Sync Vercel runtime environment"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          SESSION_SECRET: "${{ secrets.API_SESSION_SECRET }}"
          DATABASE_URL: "${{ secrets.API_DATABASE_URL }}"
        run: |
          DECLARED="SESSION_SECRET DATABASE_URL"
          vercel env ls production --token="$VERCEL_TOKEN" | tail -n +2 | awk '{print $1}' | while read -r name; do
            case " $DECLARED " in
              *" $name "*) ;;
              *) [ -n "$name" ] && { echo "Removing undeclared env: $name"; vercel env rm "$name" production --yes --token="$VERCEL_TOKEN"; } ;;
            esac
          done
          SECRET_DECLARED="SESSION_SECRET DATABASE_URL"
          for name in $SECRET_DECLARED; do
            echo "Syncing env: $name"
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$(eval "echo \$$name")" | vercel env add "$name" production --sensitive --token="$VERCEL_TOKEN"
          done
        working-directory: "./apps/api"

      - name: "Deploy to Vercel"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          VERCEL_TOKEN: "${{ secrets.PF_VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ vars.PF_VERCEL_ORG_ID }}"
          VERCEL_PROJECT_ID: "${{ vars.API_VERCEL_PROJECT_ID }}"
        run: |
          vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
        working-directory: "./apps/api"
