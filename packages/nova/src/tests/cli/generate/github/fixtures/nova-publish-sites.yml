      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        with:
          name: "build-cloudflare-workers-apps-cbnventures"
          path: "./apps/cbnventures/build"

      - name: "Deploy to Cloudflare Workers"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
        run: "npm run deploy"
        working-directory: "./apps/cbnventures"

      - name: "Sync worker runtime secrets"
        if: "${{ env.PUBLISH == 'true' }}"
        env:
          TURNSTILE_SECRET_KEY: "${{ secrets.CBN_TURNSTILE_SECRET_KEY }}"
          STRIPE_SECRET_KEY: "${{ secrets.CBN_STRIPE_SECRET_KEY }}"
          STRIPE_WEBHOOK_SECRET: "${{ secrets.CBN_STRIPE_WEBHOOK_SECRET }}"
          AMAZON_ACCESS_KEY_ID: "${{ secrets.CBN_AMAZON_ACCESS_KEY_ID }}"
