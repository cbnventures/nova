services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
[__DOCKER_COMPOSE_ENV_FILES__]
[__DOCKER_COMPOSE_PORTS__]
    restart: always
    user: "0:0"
[__DOCKER_COMPOSE_NETWORK__]
    volumes:
      - "./config:/config"
